services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tovarka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: tovarka
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tovarka -d tovarka']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
